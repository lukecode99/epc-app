<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>EPC Estimator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100dvh; color: #fff; }
    #app { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

    /* ── Screens ── */
    .screen { display: none; flex-direction: column; flex: 1; padding: 24px 20px 40px; }
    .screen.active { display: flex; }

    /* ── Home ── */
    #home { align-items: center; justify-content: center; text-align: center; gap: 20px; }
    .home-icon { font-size: 72px; }
    .home-title { font-size: 32px; font-weight: 900; letter-spacing: -1px; }
    .home-sub { color: rgba(255,255,255,0.55); font-size: 16px; line-height: 1.5; max-width: 300px; }
    .btn-primary {
      background: #7B61FF; color: #fff; border: none; border-radius: 16px;
      padding: 16px 32px; font-size: 17px; font-weight: 700; cursor: pointer;
      width: 100%; max-width: 300px; transition: opacity 0.15s;
    }
    .btn-primary:active { opacity: 0.8; }
    .band-guide { width: 100%; max-width: 340px; border-radius: 16px; overflow: hidden; margin-top: 8px; }
    .band-row { display: flex; align-items: center; padding: 8px 14px; gap: 12px; }
    .band-letter { font-size: 18px; font-weight: 900; width: 24px; }
    .band-bar-wrap { flex: 1; background: rgba(255,255,255,0.08); border-radius: 4px; height: 8px; }
    .band-bar { height: 8px; border-radius: 4px; }
    .band-range { color: rgba(255,255,255,0.45); font-size: 12px; font-weight: 600; min-width: 60px; text-align: right; }

    /* ── Questionnaire ── */
    #questionnaire { gap: 24px; }
    .progress-wrap { display: flex; align-items: center; gap: 12px; }
    .progress-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; }
    .progress-fill { height: 6px; background: #7B61FF; border-radius: 3px; transition: width 0.4s ease; }
    .progress-label { color: rgba(255,255,255,0.45); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .q-number { color: #7B61FF; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .q-text { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.3; }
    .q-options { display: flex; flex-direction: column; gap: 10px; }
    .q-option {
      background: rgba(255,255,255,0.06); border: 2px solid transparent;
      border-radius: 14px; padding: 14px 18px; font-size: 15px; font-weight: 600;
      color: #fff; cursor: pointer; text-align: left; transition: all 0.15s;
    }
    .q-option:active { background: rgba(123,97,255,0.15); }
    .q-option.selected { border-color: #7B61FF; background: rgba(123,97,255,0.2); }
    .q-input {
      background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15);
      border-radius: 14px; padding: 16px 18px; font-size: 18px; font-weight: 700;
      color: #fff; width: 100%; outline: none; transition: border-color 0.2s;
    }
    .q-input:focus { border-color: #7B61FF; }
    .q-input::placeholder { color: rgba(255,255,255,0.3); font-weight: 500; }
    .q-input-unit { color: rgba(255,255,255,0.45); font-size: 13px; margin-top: 6px; }
    .q-nav { display: flex; gap: 12px; margin-top: auto; }
    .btn-back {
      background: rgba(255,255,255,0.08); color: #fff; border: none; border-radius: 14px;
      padding: 14px 20px; font-size: 15px; font-weight: 700; cursor: pointer; flex-shrink: 0;
      transition: background 0.15s;
    }
    .btn-back:active { background: rgba(255,255,255,0.14); }
    .btn-next {
      background: #7B61FF; color: #fff; border: none; border-radius: 14px;
      padding: 14px 24px; font-size: 15px; font-weight: 700; cursor: pointer; flex: 1;
      transition: opacity 0.15s;
    }
    .btn-next:disabled { opacity: 0.35; cursor: default; }
    .btn-next:not(:disabled):active { opacity: 0.8; }

    /* ── Results ── */
    #results { gap: 20px; padding-top: 32px; }
    .result-band-card {
      border-radius: 20px; padding: 28px 24px; text-align: center; position: relative; overflow: hidden;
    }
    .result-band-letter { font-size: 96px; font-weight: 900; line-height: 1; }
    .result-band-label { font-size: 18px; font-weight: 700; margin-top: 6px; opacity: 0.9; }
    .result-score { font-size: 15px; opacity: 0.75; margin-top: 4px; }
    .result-cost { font-size: 14px; opacity: 0.65; margin-top: 2px; }

    .section-title { font-size: 13px; font-weight: 800; letter-spacing: 0.06em; color: rgba(255,255,255,0.45); text-transform: uppercase; }

    .band-chart { display: flex; flex-direction: column; gap: 5px; }
    .chart-row { display: flex; align-items: center; gap: 10px; }
    .chart-letter { font-size: 14px; font-weight: 800; width: 18px; text-align: center; }
    .chart-bar-wrap { flex: 1; border-radius: 6px; overflow: hidden; position: relative; }
    .chart-bar { height: 28px; border-radius: 6px; display: flex; align-items: center; padding: 0 10px; transition: width 0.6s ease; }
    .chart-bar-label { font-size: 11px; font-weight: 700; color: rgba(0,0,0,0.7); white-space: nowrap; }
    .chart-row.current .chart-bar-label { color: #000; font-weight: 900; }
    .chart-current-badge {
      background: #fff; color: #000; font-size: 10px; font-weight: 900;
      padding: 2px 7px; border-radius: 10px; margin-left: 6px; white-space: nowrap;
    }

    .improvements { display: flex; flex-direction: column; gap: 10px; }
    .improvement-card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 14px 16px;
    }
    .imp-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .imp-meta { display: flex; gap: 16px; flex-wrap: wrap; }
    .imp-tag { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.55); }
    .imp-tag span { color: #4ade80; }

    .result-actions { display: flex; gap: 12px; }
    .btn-secondary {
      flex: 1; background: rgba(255,255,255,0.08); color: #fff; border: none;
      border-radius: 14px; padding: 14px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-secondary:active { background: rgba(255,255,255,0.14); }

    .saved-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .saved-item {
      background: rgba(255,255,255,0.05); border-radius: 14px; padding: 14px 16px;
      display: flex; align-items: center; gap: 14px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.07);
    }
    .saved-band { font-size: 28px; font-weight: 900; width: 32px; text-align: center; }
    .saved-info { flex: 1; min-width: 0; }
    .saved-name { font-size: 14px; font-weight: 700; }
    .saved-date { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  </style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="home">
    <div class="home-icon">🏠</div>
    <div class="home-title">EPC Estimator</div>
    <div class="home-sub">Answer 9 quick questions to estimate your home's Energy Performance Certificate rating.</div>
    <button class="btn-primary" onclick="startQuestionnaire()">Start Estimate →</button>
    <div class="band-guide" id="band-guide"></div>
    <div id="saved-section" style="width:100%;max-width:340px;display:none">
      <div class="section-title" style="margin-bottom:10px">Saved Properties</div>
      <div class="saved-list" id="saved-list"></div>
    </div>
  </div>

  <!-- QUESTIONNAIRE -->
  <div class="screen" id="questionnaire">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-label" id="progress-label">1 / 9</div>
    </div>
    <div class="q-number" id="q-number">Question 1</div>
    <div class="q-text" id="q-text"></div>
    <div id="q-body"></div>
    <div class="q-nav">
      <button class="btn-back" id="btn-back" onclick="prevQuestion()">← Back</button>
      <button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>Next →</button>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="screen" id="results">
    <div class="result-band-card" id="result-card">
      <div class="result-band-letter" id="result-letter">D</div>
      <div class="result-band-label" id="result-label"></div>
      <div class="result-score" id="result-score"></div>
      <div class="result-cost" id="result-cost"></div>
    </div>
    <div class="section-title">EPC Band Chart</div>
    <div class="band-chart" id="band-chart"></div>
    <div class="section-title">Top Improvements</div>
    <div class="improvements" id="improvements"></div>
    <div class="result-actions">
      <button class="btn-secondary" onclick="shareResult()">Share</button>
      <button class="btn-secondary" id="save-btn" onclick="saveResult()">Save</button>
      <button class="btn-secondary" onclick="showScreen('home');loadHome()">New Estimate</button>
    </div>
  </div>

</div>
<script>
// ── Data ──────────────────────────────────────────────────────────────────────
const BANDS = [
  { band:'A', min:92, max:100, color:'#00A651', label:'Very energy efficient' },
  { band:'B', min:81, max:91,  color:'#50B848', label:'Energy efficient' },
  { band:'C', min:69, max:80,  color:'#BED600', label:'Fairly efficient' },
  { band:'D', min:55, max:68,  color:'#FFD700', label:'Average efficiency' },
  { band:'E', min:39, max:54,  color:'#F7941D', label:'Below average' },
  { band:'F', min:21, max:38,  color:'#EF3E33', label:'Poor efficiency' },
  { band:'G', min:1,  max:20,  color:'#CC0000', label:'Very poor efficiency' },
];

const QUESTIONS = [
  { key:'propertyType', text:'What type of property is it?', type:'choice', options:[
    {label:'Detached house', value:'detached'},
    {label:'Semi-detached house', value:'semi'},
    {label:'Terraced house', value:'terraced'},
    {label:'Flat / apartment', value:'flat'},
    {label:'Bungalow', value:'bungalow'},
  ]},
  { key:'floorArea', text:'Approximate floor area?', type:'number', unit:'square metres (m²)', placeholder:'e.g. 85' },
  { key:'constructionEra', text:'When was the property built?', type:'choice', options:[
    {label:'Before 1930', value:'pre1930'},
    {label:'1930 – 1966', value:'1930_1966'},
    {label:'1967 – 1982', value:'1967_1982'},
    {label:'1983 – 1995', value:'1983_1995'},
    {label:'1996 – 2010', value:'1996_2010'},
    {label:'After 2010', value:'post2010'},
  ]},
  { key:'wallType', text:'What type of walls does the property have?', type:'choice', options:[
    {label:'Solid walls — no insulation', value:'solid_none'},
    {label:'Solid walls — insulated', value:'solid_ins'},
    {label:'Cavity walls — uninsulated', value:'cavity_none'},
    {label:'Cavity walls — insulated', value:'cavity_ins'},
    {label:'Not sure', value:'unknown'},
  ]},
  { key:'loftInsulation', text:'How much loft insulation is there?', type:'choice', options:[
    {label:'No loft insulation', value:'none'},
    {label:'Less than 100mm', value:'partial'},
    {label:'100mm – 200mm', value:'100mm'},
    {label:'200mm or more', value:'200mm'},
    {label:'Flat roof / no loft', value:'flat'},
  ]},
  { key:'glazing', text:'What type of windows?', type:'choice', options:[
    {label:'Single glazing', value:'single'},
    {label:'Mostly single, some double', value:'partial'},
    {label:'Double glazing throughout', value:'double'},
    {label:'Triple glazing', value:'triple'},
  ]},
  { key:'heatingType', text:'Main heating system?', type:'choice', options:[
    {label:'Gas boiler (central heating)', value:'gas'},
    {label:'Oil boiler', value:'oil'},
    {label:'Heat pump (air or ground)', value:'heatpump'},
    {label:'Electric storage heaters', value:'storage'},
    {label:'Direct electric heaters', value:'electric'},
  ]},
  { key:'boilerAge', text:'How old is the boiler / heating system?', type:'choice', options:[
    {label:'Less than 5 years', value:'under5'},
    {label:'5 – 10 years', value:'5_10'},
    {label:'10 – 15 years', value:'10_15'},
    {label:'Over 15 years', value:'over15'},
    {label:'Not applicable (heat pump / electric)', value:'na'},
  ]},
  { key:'hotWater', text:'How is hot water heated?', type:'choice', options:[
    {label:'Same boiler as heating', value:'combi'},
    {label:'Separate gas water heater', value:'gas'},
    {label:'Electric immersion heater', value:'immersion'},
    {label:'Solar thermal / heat pump', value:'solar'},
  ]},
];

// ── SAP Scoring ───────────────────────────────────────────────────────────────
function calculateSAP(a) {
  let score = 63;
  const era = { pre1930:-12, '1930_1966':-7, '1967_1982':-4, '1983_1995':-1, '1996_2010':3, post2010:10 };
  score += era[a.constructionEra] || 0;
  const wall = { solid_none:-10, solid_ins:2, cavity_none:-5, cavity_ins:4, unknown:-3 };
  score += wall[a.wallType] || 0;
  const loft = { none:-8, partial:-3, '100mm':2, '200mm':5, flat:0 };
  score += loft[a.loftInsulation] || 0;
  const glaz = { single:-6, partial:-2, double:3, triple:6 };
  score += glaz[a.glazing] || 0;
  const heat = { gas:0, oil:-3, heatpump:12, storage:-5, electric:-8 };
  score += heat[a.heatingType] || 0;
  const boiler = { under5:5, '5_10':2, '10_15':-1, over15:-5, na:0 };
  score += boiler[a.boilerAge] || 0;
  const hw = { combi:0, gas:-1, immersion:-4, solar:4 };
  score += hw[a.hotWater] || 0;
  const area = parseFloat(a.floorArea) || 85;
  if (area < 50) score += 4;
  else if (area > 150) score -= 4;
  else if (area > 100) score -= 2;
  return Math.max(1, Math.min(100, Math.round(score)));
}

function getBand(score) {
  return BANDS.find(b => score >= b.min && score <= b.max) || BANDS[BANDS.length-1];
}

function getAnnualCost(a) {
  const area = parseFloat(a.floorArea) || 85;
  const baseCost = { gas:900, oil:1200, heatpump:700, storage:1400, electric:1800 };
  let cost = baseCost[a.heatingType] || 900;
  cost *= (area / 85);
  const insAdj = { solid_none:1.4, cavity_none:1.2, solid_ins:0.95, cavity_ins:0.85, unknown:1.15 };
  cost *= (insAdj[a.wallType] || 1);
  return Math.round(cost / 50) * 50;
}

function getImprovements(a, score) {
  const improvements = [];
  if (a.loftInsulation === 'none' || a.loftInsulation === 'partial') {
    improvements.push({ title:'Loft insulation (200mm+)', cost:'£300–£600', saving:'£200–£350/yr', scoreGain: a.loftInsulation==='none' ? 13 : 8 });
  }
  if (a.wallType === 'solid_none') {
    improvements.push({ title:'External or internal wall insulation', cost:'£4,000–£14,000', saving:'£400–£600/yr', scoreGain:12 });
  }
  if (a.wallType === 'cavity_none') {
    improvements.push({ title:'Cavity wall insulation', cost:'£500–£1,500', saving:'£200–£300/yr', scoreGain:9 });
  }
  if (a.glazing === 'single' || a.glazing === 'partial') {
    improvements.push({ title:'Double glazing throughout', cost:'£3,000–£8,000', saving:'£150–£200/yr', scoreGain: a.glazing==='single' ? 9 : 5 });
  }
  if (a.heatingType === 'gas' && (a.boilerAge === 'over15' || a.boilerAge === '10_15')) {
    improvements.push({ title:'Replace boiler (condensing A-rated)', cost:'£2,500–£4,000', saving:'£200–£350/yr', scoreGain:6 });
  }
  if (a.heatingType !== 'heatpump') {
    improvements.push({ title:'Air source heat pump', cost:'£7,000–£13,000', saving:'£500–£900/yr', scoreGain:12 });
  }
  if (a.hotWater !== 'solar') {
    improvements.push({ title:'Solar thermal hot water', cost:'£3,000–£5,000', saving:'£100–£200/yr', scoreGain:4 });
  }
  improvements.sort((a,b) => b.scoreGain - a.scoreGain);
  return improvements.slice(0, 5).map(i => ({
    ...i,
    newScore: Math.min(100, score + i.scoreGain),
    newBand: getBand(Math.min(100, score + i.scoreGain)).band
  }));
}

// ── State ─────────────────────────────────────────────────────────────────────
let currentQ = 0;
let answers = {};
let currentResult = null;
let savedResults = JSON.parse(localStorage.getItem('epcSaved') || '[]');

// ── Screens ───────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── Home ──────────────────────────────────────────────────────────────────────
function loadHome() {
  const guide = document.getElementById('band-guide');
  guide.innerHTML = BANDS.map(b => {
    const width = 40 + (b.max - b.min) * 0.8;
    return `<div class="band-row" style="background:${b.color}22">
      <span class="band-letter" style="color:${b.color}">${b.band}</span>
      <div class="band-bar-wrap"><div class="band-bar" style="background:${b.color};width:${width}%"></div></div>
      <span class="band-range" style="color:${b.color}">${b.min}–${b.max}</span>
    </div>`;
  }).join('');

  const sec = document.getElementById('saved-section');
  if (savedResults.length) {
    sec.style.display = '';
    document.getElementById('saved-list').innerHTML = savedResults.map(r => `
      <div class="saved-item" onclick="showSavedResult(${r.id})">
        <div class="saved-band" style="color:${r.bandColor}">${r.band}</div>
        <div class="saved-info">
          <div class="saved-name">${r.propertyType} · ${r.floorArea}m²</div>
          <div class="saved-date">${r.date} · Score ${r.score}/100</div>
        </div>
      </div>`).join('');
  } else {
    sec.style.display = 'none';
  }
}

function showSavedResult(id) {
  const r = savedResults.find(x => x.id === id);
  if (!r) return;
  answers = r.answers;
  currentResult = { score: r.score, band: r.band, bandColor: r.bandColor, bandLabel: r.bandLabel, annualCost: r.annualCost };
  renderResults(r.score, r.answers);
  showScreen('results');
  document.getElementById('save-btn').textContent = 'Saved ✓';
  document.getElementById('save-btn').disabled = true;
}

// ── Questionnaire ─────────────────────────────────────────────────────────────
function startQuestionnaire() {
  currentQ = 0;
  answers = {};
  renderQuestion();
  showScreen('questionnaire');
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  const pct = ((currentQ) / QUESTIONS.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${currentQ + 1} / ${QUESTIONS.length}`;
  document.getElementById('q-number').textContent = `Question ${currentQ + 1}`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('btn-back').style.display = currentQ === 0 ? 'none' : '';

  const body = document.getElementById('q-body');
  const btnNext = document.getElementById('btn-next');
  btnNext.textContent = currentQ === QUESTIONS.length - 1 ? 'See Results →' : 'Next →';

  if (q.type === 'choice') {
    body.innerHTML = `<div class="q-options">${q.options.map(o =>
      `<button class="q-option${answers[q.key] === o.value ? ' selected' : ''}" onclick="selectOption('${o.value}')">${o.label}</button>`
    ).join('')}</div>`;
    btnNext.disabled = !answers[q.key];
  } else {
    body.innerHTML = `
      <input class="q-input" id="num-input" type="number" min="1" max="1000"
        placeholder="${q.placeholder}" value="${answers[q.key] || ''}"
        oninput="answers['${q.key}']=this.value;document.getElementById('btn-next').disabled=!this.value||this.value<1" />
      <div class="q-input-unit">${q.unit}</div>`;
    btnNext.disabled = !answers[q.key] || answers[q.key] < 1;
    setTimeout(() => document.getElementById('num-input')?.focus(), 50);
  }
}

function selectOption(value) {
  const q = QUESTIONS[currentQ];
  answers[q.key] = value;
  document.querySelectorAll('.q-option').forEach(el => el.classList.remove('selected'));
  event.target.classList.add('selected');
  document.getElementById('btn-next').disabled = false;
}

function nextQuestion() {
  if (currentQ < QUESTIONS.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    showResults();
  }
}

function prevQuestion() {
  if (currentQ > 0) { currentQ--; renderQuestion(); }
  else showScreen('home');
}

// ── Results ───────────────────────────────────────────────────────────────────
function showResults() {
  const score = calculateSAP(answers);
  renderResults(score, answers);
  showScreen('results');
  document.getElementById('save-btn').textContent = 'Save';
  document.getElementById('save-btn').disabled = false;
}

function renderResults(score, a) {
  const band = getBand(score);
  const annualCost = getAnnualCost(a);
  currentResult = { score, band: band.band, bandColor: band.color, bandLabel: band.label, annualCost };

  const card = document.getElementById('result-card');
  card.style.background = band.color + '22';
  card.style.border = `2px solid ${band.color}44`;
  document.getElementById('result-letter').textContent = band.band;
  document.getElementById('result-letter').style.color = band.color;
  document.getElementById('result-label').textContent = band.label;
  document.getElementById('result-score').textContent = `SAP Score: ${score} / 100`;
  document.getElementById('result-cost').textContent = `Estimated annual energy cost: ~£${annualCost.toLocaleString()}`;

  // Band chart
  const chart = document.getElementById('band-chart');
  chart.innerHTML = BANDS.map(b => {
    const isCurrent = score >= b.min && score <= b.max;
    const width = 30 + (b.max / 100) * 70;
    return `<div class="chart-row${isCurrent ? ' current' : ''}">
      <div class="chart-letter" style="color:${b.color}">${b.band}</div>
      <div class="chart-bar-wrap">
        <div class="chart-bar" style="background:${b.color};width:${width}%">
          <span class="chart-bar-label">${b.min}–${b.max}</span>
          ${isCurrent ? `<span class="chart-current-badge">YOU ★</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  // Improvements
  const imps = getImprovements(a, score);
  document.getElementById('improvements').innerHTML = imps.map(i => `
    <div class="improvement-card">
      <div class="imp-title">${i.title}</div>
      <div class="imp-meta">
        <div class="imp-tag">Cost: <span style="color:#fbbf24">${i.cost}</span></div>
        <div class="imp-tag">Saves: <span>${i.saving}</span></div>
        <div class="imp-tag">Band → <span>${i.newBand}</span></div>
      </div>
    </div>`).join('');
}

function saveResult() {
  const area = parseFloat(answers.floorArea) || 85;
  const propType = QUESTIONS[0].options.find(o => o.value === answers.propertyType)?.label || 'Property';
  const entry = {
    id: Date.now(),
    ...currentResult,
    propertyType: propType,
    floorArea: area,
    answers: { ...answers },
    date: new Date().toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })
  };
  savedResults.unshift(entry);
  if (savedResults.length > 20) savedResults.pop();
  localStorage.setItem('epcSaved', JSON.stringify(savedResults));
  document.getElementById('save-btn').textContent = 'Saved ✓';
  document.getElementById('save-btn').disabled = true;
}

async function shareResult() {
  const band = currentResult?.band || '?';
  const score = currentResult?.score || 0;
  const text = `My home's estimated EPC rating is ${band} (score: ${score}/100). Check yours at ${location.href}`;
  if (navigator.share) {
    try { await navigator.share({ title: 'My EPC Estimate', text }); } catch(e) {}
  } else {
    navigator.clipboard?.writeText(text);
    alert('Result copied to clipboard!');
  }
}
